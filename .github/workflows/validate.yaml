name: Validate

on:
  push:
    paths-ignore:
      - "website/**"

  pull_request:
    paths-ignore:
      - "website/**"

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
